buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
    }
}

def flutterSdkPath = System.getenv("FLUTTER_SDK")
if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
    throw new GradleException("A variável de ambiente FLUTTER_SDK precisa apontar para o diretório do Flutter SDK para compilar o AAR.")
}

// Resolve link simbólico se necessário
def flutterSdkFile = file(flutterSdkPath)
if (flutterSdkFile.exists() && !flutterSdkFile.isDirectory()) {
    flutterSdkPath = flutterSdkFile.canonicalPath
}

// Tenta múltiplos caminhos possíveis para o flutter.jar
def flutterJar = null

// Primeiro, tenta buscar recursivamente no diretório de artifacts
def flutterEngineDir = file("${flutterSdkPath}/bin/cache/artifacts/engine")
if (flutterEngineDir.exists()) {
    def jarFiles = fileTree(dir: flutterEngineDir, include: '**/flutter.jar')
    if (!jarFiles.isEmpty()) {
        flutterJar = jarFiles.files.first()
    }
}

// Se não encontrou, tenta caminhos específicos conhecidos
if (flutterJar == null) {
    def possiblePaths = [
        "${flutterSdkPath}/bin/cache/artifacts/engine/android-x64/flutter.jar",
        "${flutterSdkPath}/bin/cache/artifacts/engine/android-arm64/flutter.jar",
        "${flutterSdkPath}/bin/cache/artifacts/engine/android-arm/flutter.jar",
        "${flutterSdkPath}/bin/cache/artifacts/engine/android-x86/flutter.jar",
    ]
    
    for (path in possiblePaths) {
        def jarFile = file(path)
        if (jarFile.exists()) {
            flutterJar = jarFile
            break
        }
    }
}

if (flutterJar == null) {
    throw new GradleException("Não foi possível localizar flutter.jar em ${flutterSdkPath}/bin/cache/artifacts/engine. Execute 'flutter precache --android' ou verifique se FLUTTER_SDK está correto.")
}

apply plugin: 'com.android.library'

group = "br.com.jylabtech.pagseguro_payment_tech"
version = "1.0.0"

repositories {
    google()
    mavenCentral()
    maven {
        url 'https://github.com/pagseguro/PlugPagServiceWrapper/raw/master'
    }
}

android {
    namespace "br.com.jylabtech.pagseguro_payment_tech"
    compileSdk = 35

    defaultConfig {
        minSdk = 23
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        buildConfig = false
    }

    lint {
        disable.add("InvalidPackage")
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    compileOnly files(flutterJar)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
    implementation 'com.google.dagger:dagger:2.38.1'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.38.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.1.16'
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.2'
    implementation 'com.hannesdorfmann.mosby:mvp:2.0.1'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'br.com.uol.pagseguro.plugpagservice.wrapper:wrapper:1.30.52'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha05'

    testImplementation 'junit:junit:4.13.2'
}


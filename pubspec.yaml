name: pagseguro_payment_tech
description: Integre o Flutter com maquinas smarts da Pagseguro, utilizando o SDK do Pagseguro. Rápido e fácil.
version: 3.3.0
repository: https://github.com/JY-Labtech/pagseguro_payment_tech

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  #check_licence_tech: ^0.1.1
  #check_licence_tech:
  #  path: ../check_licence_tech

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Somente testes: mock do path_provider no teste do PrintRenderWidget.
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
  flutter_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: br.com.jylabtech.pagseguro_payment_tech
        pluginClass: PagseguroPaymentTechPlugin
      ios:
        pluginClass: PagseguroPaymentTechPlugin

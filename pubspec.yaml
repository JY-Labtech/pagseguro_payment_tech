name: pagseguro_payment_tech
description: Flutter plugin for PagSeguro Smart POS terminals (PlugPagServiceWrapper SDK) with credit, debit, PIX and voucher payments, refunds, printing and NFC.
version: 4.0.0
homepage: https://github.com/JY-Labtech/pagseguro_payment_tech
repository: https://github.com/JY-Labtech/pagseguro_payment_tech
issue_tracker: https://github.com/JY-Labtech/pagseguro_payment_tech/issues
topics:
  - payment
  - pos
  - android
  - flutter-plugin
  - brazil

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Somente testes: mock do path_provider no teste do PrintRenderWidget.
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
  flutter_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: br.com.jylabtech.pagseguro_payment_tech
        pluginClass: PagseguroPaymentTechPlugin
      ios:
        pluginClass: PagseguroPaymentTechPlugin
